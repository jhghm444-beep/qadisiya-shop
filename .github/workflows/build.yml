name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Extract Flutter project
        run: |
          mkdir flutter_project
          unzip -q qadisiya_shop_complete.zip -d flutter_project

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find flutter_project -name pubspec.yaml -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Find Gradle wrapper
        run: |
          GRADLE_FILE=$(find "$PROJECT_DIR" -name gradle-wrapper.properties -type f -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradle-wrapper.properties not found"
            find "$PROJECT_DIR/android" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "GRADLE_FILE=$GRADLE_FILE" >> "$GITHUB_ENV"
          echo "Gradle wrapper found at: $GRADLE_FILE"

      - name: Fix Gradle version
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.9-all.zip#' "$GRADLE_FILE"
          cat "$GRADLE_FILE"

      - name: Get dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qadisiya-shop-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
